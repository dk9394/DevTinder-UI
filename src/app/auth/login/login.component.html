<section class="login container">
  <div class="form-wrapper">
    <div class="row">
      <div class="col">
        <h1>Login</h1>
        <form (ngSubmit)="onSubmit()" [formGroup]="loginForm">
          <div class="mb-3">
            <label for="loginEmailId" class="form-label">Email</label>
            <input
              type="email"
              id="loginEmailId"
              name="emailId"
              class="form-control"
              [class.is-invalid]="showFieldError(emailIdField)"
              formControlName="emailId"
              placeholder="Enter your email"
              required
            />
            <div class="invalid-feedback" *ngIf="showFieldError(emailIdField)">
              <span *ngIf="emailIdField?.errors?.['required']">
                Email is required.
              </span>
              <span *ngIf="emailIdField?.errors?.['email']">
                Please enter a valid email address.
              </span>
            </div>
          </div>
          <div class="mb-3">
            <label for="loginPasswordField" class="form-label">Password</label>
            <input
              type="password"
              id="loginPasswordField"
              name="password"
              class="form-control"
              [class.is-invalid]="showFieldError(passwordField)"
              formControlName="password"
              placeholder="Enter your password"
              required
            />
            <div class="invalid-feedback" *ngIf="showFieldError(passwordField)">
              <span *ngIf="passwordField?.errors?.['required']">
                Password is required.
              </span>
              <span *ngIf="passwordField?.errors?.['minlength']">
                Minimum 6 characters are required.
              </span>
            </div>
          </div>
          <div class="form-buttons">
            <button
              type="submit"
              class="btn btn-lg btn-primary"
              [disabled]="!loginForm.valid"
            >
              Login
            </button>
          </div>

          <!-- <button type="button" (click)="onToastShow()">Show Toast</button> -->

          <!-- <p>{{ expiresAt | date : "h:mm a" }}</p> -->
        </form>
      </div>
    </div>
  </div>
  <p class="text-center">
    Not a member yet? Please
    <a [routerLink]="['../', 'register']">register</a> here.
  </p>
</section>
